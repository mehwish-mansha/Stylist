<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection</title>

  <!-- MDB -->
  <link rel="stylesheet" href="/collections/MDB5-STANDARD-UI-KIT-Free-9.3.0/css/mdb.min.css" />

  <!-- Global Styles -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/footer.css">

  <!-- Collection Style -->
  <link rel="stylesheet" href="collection.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>

  <!-- NAV -->
  <div id="nav-container"></div>

  <!-- FILTER PANEL OVERLAY -->
  <div id="filter-overlay"></div>

  <!-- FILTER PANEL -->
  <div id="collection-panel">
    <div class="panel-header">
      <h4><i class="fa-solid fa-layer-group me-2" style="font-size:0.95rem;"></i>Collections</h4>
      <button class="panel-close" id="close-panel-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="panel-list" id="panel-list"></div>
  </div>

  <!-- COLLECTION SECTION -->
  <section class="collection-section">
    <div class="container">
      <div class="collection-toolbar">
        <button id="open-filter-btn">
          <i class="fa-solid fa-sliders"></i>
          Filter
        </button>
        <span id="active-collection-label">
          Showing: <strong id="active-label-text">All Collections</strong>
          <button class="reset-btn" id="reset-filter-btn" style="display:none;">✕ Reset</button>
        </span>
      </div>

      <h2 class="main-heading text-center mb-4" id="collectionHeading">All Collections</h2>
      <div class="filter-bar" id="filterBar"></div>
      <div class="row" id="cardlist"></div>
    </div>
  </section>

  <!-- COMPARE BAR  -->
  <div id="compare-bar">
    <span class="compare-label"><i class="fa-solid fa-code-compare me-1"></i> Compare:</span>
    <div class="compare-items" id="compareChips"></div>
    <button id="btn-compare-now">Compare Now</button>
    <button id="btn-clear-compare">Clear</button>
  </div>

  <!-- COMPARE MODAL -->
  <div id="compare-modal">
    <div class="compare-modal-inner">
      <div class="compare-modal-header">
        <h3>Product Comparison</h3>
        <button class="modal-close-btn" id="compareCloseBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div style="overflow-x:auto;">
        <table class="compare-table" id="compareTable"></table>
      </div>
    </div>
  </div>

  <!-- WISHLIST TOAST -->
  <div id="wishlist-toast" style="
    position:fixed; bottom:28px; right:24px;
    background:#3b1d23; color:#fff;
    padding:13px 20px; border-radius:12px;
    display:flex; align-items:center; gap:12px;
    font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:500;
    box-shadow:0 8px 24px rgba(59,29,35,0.22);
    z-index:9999; opacity:0; transform:translateY(14px);
    transition:opacity 0.3s, transform 0.3s; pointer-events:none;">
    <i class="fa-solid fa-heart" style="color:#e8a0a8;"></i>
    <span id="wishlist-toast-msg">Added to favourites!</span>
  </div>

  <!-- FOOTER -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/collections/MDB5-STANDARD-UI-KIT-Free-9.3.0/js/mdb.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- Shared data -->
  <script src="/data/collections-data.js"></script>
  <script src="/main.js"></script>

  <script>

    $(function () {
      $("#nav-container").load("/nav.html");
      $("#footer-container").load("/footer.html");
    });

    let compareList = [];

    const collectionMeta = {
      all: { label: "All Collections", icon: "fa-th-large", count: null },
      bridal: { label: "Bridal", icon: "fa-ring", count: null },
      eid: { label: "Eid", icon: "fa-star-and-crescent", count: null },
      western: { label: "Western", icon: "fa-shirt", count: null },
      winter: { label: "Winter", icon: "fa-snowflake", count: null },
      summer: { label: "Summer", icon: "fa-sun", count: null },
      modest: { label: "Modest", icon: "fa-layer-group", count: null },
      luxury: { label: "Luxury", icon: "fa-gem", count: null },
      men: { label: "Men's", icon: "fa-person", count: null },
      kids: { label: "Kids", icon: "fa-child", count: null },
      party: { label: "Party", icon: "fa-champagne-glasses", count: null },
      jewelry: { label: "Jewelry", icon: "fa-crown", count: null },
      bags: { label: "Bags", icon: "fa-bag-shopping", count: null },
      shoes: { label: "Shoes", icon: "fa-shoe-prints", count: null },
    };

    let currentType = "all";
    let currentCatFilter = null;

    //  WISHLIST HELPERS
    function getWishlist() {
      return JSON.parse(localStorage.getItem("wishlist")) || [];
    }

    function saveWishlist(wl) {
      localStorage.setItem("wishlist", JSON.stringify(wl));
      // Update badge if nav is loaded
      const total = wl.length;
      const $badge = $("#wishlist-badge");
      total > 0 ? $badge.text(total).css("display", "flex") : $badge.hide();
    }

    function isWishlisted(type, index) {
      return getWishlist().some(w => w.id === type + "_" + index);
    }

    function toggleWishlist(type, index) {
      const col = collections[type];
      const item = col.items[index];
      const isAcc = col.type === "accessory";
      const id = type + "_" + index;
      let wl = getWishlist();

      if (wl.some(w => w.id === id)) {
        wl = wl.filter(w => w.id !== id);
        saveWishlist(wl);
        return false; // removed
      } else {
        wl.push({
          id,
          name: item.title,
          category: item.category || col.title,
          price: "Rs. " + item.price,
          image: isAcc ? item.frontImg : item.image
        });
        saveWishlist(wl);
        return true; // added
      }
    }

    function showWishlistToast(msg) {
      const $t = $("#wishlist-toast");
      $("#wishlist-toast-msg").text(msg);
      $t.css({ opacity: 1, transform: "translateY(0)", pointerEvents: "auto" });
      clearTimeout(window._wlToast);
      window._wlToast = setTimeout(() => {
        $t.css({ opacity: 0, transform: "translateY(14px)", pointerEvents: "none" });
      }, 2400);
    }

    
    $(document).ready(function () {

      const urlParams = new URLSearchParams(window.location.search);
      const urlType = urlParams.get("type");

      Object.keys(collections).forEach(key => {
        if (collectionMeta[key]) collectionMeta[key].count = collections[key].items.length;
      });

      buildPanel();

      if (urlType && collections[urlType]) {
        switchCollection(urlType, false);
      } else {
        switchCollection("all", false);
      }

      $("#open-filter-btn").on("click", openPanel);
      $("#close-panel-btn, #filter-overlay").on("click", closePanel);
      $("#reset-filter-btn").on("click", () => switchCollection("all"));
      $("#btn-compare-now").on("click", openCompareModal);
      $("#btn-clear-compare").on("click", clearCompare);
      $("#compareCloseBtn").on("click", () => $("#compare-modal").removeClass("open"));
      $("#compare-modal").on("click", function (e) {
        if ($(e.target).is("#compare-modal")) $(this).removeClass("open");
      });

      // ── Accessory dot switcher ────────────────────────────
      $(document).on("click", ".acc-dot", function () {
        const $card = $(this).closest(".accessory-card");
        const idx = parseInt($(this).data("img-index"));
        const $imgs = $card.find(".product-img");
        const $dots = $card.find(".acc-dot");
        $imgs.removeClass("active");
        $dots.removeClass("active");
        $imgs.eq(idx).addClass("active");
        $(this).addClass("active");
      });

      // ── Clothing card: Favourite button ──────────────────
      $(document).on("click", ".card-fav-btn", function (e) {
        e.preventDefault();
        const $btn = $(this);
        const type = $btn.data("type");
        const index = parseInt($btn.data("index"));
        const added = toggleWishlist(type, index);

        const $icon = $btn.find("i");
        if (added) {
          $icon.removeClass("fa-regular").addClass("fa-solid");
          $btn.addClass("fav-active");
          showWishlistToast("Added to favourites!");
        } else {
          $icon.removeClass("fa-solid").addClass("fa-regular");
          $btn.removeClass("fav-active");
          showWishlistToast("Removed from favourites.");
        }
      });

      // ── Clothing card: Compare button ────────────────────
      $(document).on("click", ".card-compare-btn", function (e) {
        e.preventDefault();
        const $btn = $(this);
        const type = $btn.data("type");
        const index = parseInt($btn.data("index"));
        const col = collections[type];
        if (!col) return;
        const item = col.items[index];

        const alreadyIn = compareList.findIndex(c => c.index === index && c.type === type);
        if (alreadyIn !== -1) {
          compareList.splice(alreadyIn, 1);
          $btn.removeClass("compare-active");
          $btn.attr("title", "Compare");
        } else {
          if (compareList.length >= 4) {
            alert("You can compare up to 4 products at a time.");
            return;
          }
          compareList.push({ index, item, type });
          $btn.addClass("compare-active");
          $btn.attr("title", "Remove from compare");
        }
        updateCompareBar();
      });

      // ── Accessory card: Favourite button ─────────────────
      $(document).on("click", ".fav-btn", function (e) {
        e.preventDefault();
        const $btn = $(this);
        const type = $btn.data("type");
        const index = parseInt($btn.data("id"));
        const added = toggleWishlist(type, index);
        const $icon = $btn.find("i");

        if (added) {
          $icon.removeClass("fa-regular").addClass("fa-solid");
          $btn.css("color", "#d63031").addClass("active");
          showWishlistToast("Added to favourites!");
        } else {
          $icon.removeClass("fa-solid").addClass("fa-regular");
          $btn.css("color", "").removeClass("active");
          showWishlistToast("Removed from favourites.");
        }
      });

      // ── Accessory card: Compare toggle via icon ───────────
      $(document).on("click", ".acc-compare-btn", function (e) {
        e.preventDefault();
        const $btn = $(this);
        const type = $btn.data("type");
        const index = parseInt($btn.data("index"));
        const col = collections[type];
        if (!col) return;
        const item = col.items[index];

        const alreadyIn = compareList.findIndex(c => c.index === index && c.type === type);
        if (alreadyIn !== -1) {
          compareList.splice(alreadyIn, 1);
          $btn.removeClass("compare-active");
        } else {
          if (compareList.length >= 4) {
            alert("You can compare up to 4 products at a time.");
            return;
          }
          compareList.push({ index, item, type });
          $btn.addClass("compare-active");
        }
        updateCompareBar();
      });

    }); // end document.ready


    //  BUILD PANEL
    function buildPanel() {
      const $list = $("#panel-list");
      $list.empty();
      $list.append(buildPanelBtn("all"));
      $list.append('<div style="height:1px;background:rgba(201,169,110,0.1);margin:8px 0;"></div>');
      Object.keys(collectionMeta).forEach(key => {
        if (key === "all" || !collections[key]) return;
        $list.append(buildPanelBtn(key));
      });
    }

    function buildPanelBtn(key) {
      const meta = collectionMeta[key] || { label: key, icon: "fa-circle" };
      const count = meta.count !== null ? meta.count : (collections[key] ? collections[key].items.length : "");
      const $btn = $(`
        <button class="panel-collection-btn" data-key="${key}">
          <i class="fa-solid ${meta.icon} btn-icon"></i>
          ${meta.label}
          ${count ? `<span class="btn-count">${count}</span>` : ""}
        </button>`);
      $btn.on("click", function () { switchCollection(key); closePanel(); });
      return $btn;
    }


    function switchCollection(key, updateUrl = true) {
      currentType = key;
      currentCatFilter = null;
      compareList = [];
      updateCompareBar();

      $(".panel-collection-btn").removeClass("active");
      $(`.panel-collection-btn[data-key="${key}"]`).addClass("active");

      if (key === "all") {
        $("#active-label-text").text("All Collections");
        $("#reset-filter-btn").hide();
        $("#open-filter-btn").removeClass("has-filter");
        $("#collectionHeading").text("All Collections");
        $("#filterBar").empty().hide();
      } else {
        const label = collectionMeta[key]?.label || key;
        $("#active-label-text").text(label);
        $("#reset-filter-btn").show();
        $("#open-filter-btn").addClass("has-filter");
        $("#collectionHeading").text(collections[key].title);
        buildCategoryTabs(key);
      }

      key === "all" ? renderMixedCards() : renderCards(collections[key], key, null);

      if (updateUrl) {
        const newUrl = key === "all" ? window.location.pathname : `${window.location.pathname}?type=${key}`;
        window.history.replaceState({}, "", newUrl);
      }
    }



    function buildCategoryTabs(type) {
      const collection = collections[type];
      const $filterBar = $("#filterBar");
      $filterBar.empty();

      if (collection.type === "accessory") { $filterBar.hide(); return; }

      const cats = ["All", ...new Set(collection.items.map(i => i.category))];
      cats.forEach(cat => {
        const $btn = $(`<button class="filter-btn">${cat}</button>`);
        if (cat === "All") $btn.addClass("active");
        $btn.on("click", function () {
          $(".filter-btn").removeClass("active");
          $(this).addClass("active");
          currentCatFilter = cat === "All" ? null : cat;
          renderCards(collection, type, currentCatFilter);
        });
        $filterBar.append($btn);
      });
      $filterBar.show();
    }


    //  RENDER MIXED CARDS
    function renderMixedCards() {
      const $cardList = $("#cardlist");
      $cardList.empty();

      let allItems = [];
      Object.keys(collections).forEach(type => {
        const col = collections[type];

        // --- ADD THIS CHECK HERE ---
        // If the collection type is 'accessory', skip this iteration
        if (col.type === "accessory") return;

        const items = col.items;
        // Shuffling a few items from each clothing collection to show on 'All'
        const shuffled = [...items].sort(() => Math.random() - 0.5).slice(0, 4);

        shuffled.forEach(item => {
          allItems.push({ item, type, originalIndex: items.indexOf(item) });
        });
      });

      // Final shuffle of the combined clothing list
      allItems = allItems.sort(() => Math.random() - 0.5);

      if (allItems.length === 0) {
        $cardList.html('<p class="text-center py-5" style="color:#aaa;">No items found.</p>');
        return;
      }

      allItems.forEach(({ item, type, originalIndex }) => {
        // Since we filtered out accessories above, isAccessory (5th param) is always false
        appendCard($cardList, item, type, originalIndex, false);
      });
    }


    //  RENDER CARDS (single collection)
    function renderCards(collection, type, filterCat) {
      const $cardList = $("#cardlist");
      $cardList.empty();

      const items = filterCat
        ? collection.items.filter(i => i.category === filterCat)
        : collection.items;

      items.forEach(el => {
        const originalIndex = collection.items.indexOf(el);
        appendCard($cardList, el, type, originalIndex, !!el.frontImg);
      });
    }


    //  APPEND CARD  —  clothing vs accessory
    function appendCard($container, el, type, originalIndex, isAccessory) {
      const cmpId = `cmp-${type}-${originalIndex}`;
      const favActive = isWishlisted(type, originalIndex);
      const inCompare = compareList.some(c => c.index === originalIndex && c.type === type);

      if (!isAccessory) {
        // ── CLOTHING CARD ─────────────────────────────────────
        $container.append(`
          <div class="col-6 col-md-4 col-lg-3 mb-4">
            <div class="product-card">
              <div class="product-image position-relative">
                <span class="badge-new"><i class="fa-solid fa-bolt"></i> ${el.badge || "New"}</span>

                
                <input type="checkbox" id="${cmpId}" data-index="${originalIndex}" data-type="${type}" class="compare-cb" ${inCompare ? "checked" : ""}>

                
                <div class="card-actions">
                  <button class="card-action-btn card-fav-btn ${favActive ? "fav-active" : ""}"
                    data-type="${type}" data-index="${originalIndex}" title="Add to Favourites">
                    <i class="fa-${favActive ? "solid" : "regular"} fa-heart"></i>
                  </button>
                  <button class="card-action-btn card-compare-btn ${inCompare ? "compare-active" : ""}"
                    data-type="${type}" data-index="${originalIndex}" title="Compare">
                    <i class="fa-solid fa-code-compare"></i>
                  </button>
                  <a href="/All Collections/product-detail.html?type=${type}&id=${originalIndex}"
                    class="card-action-btn" title="View Details">
                    <i class="fa-regular fa-eye"></i>
                  </a>
                </div>

                <a href="/All Collections/product-detail.html?type=${type}&id=${originalIndex}">
                  <img src="${el.image}" alt="${el.title}" class="img-fluid">
                </a>
                
              </div>
              <div class="product-content text-center">
                <h3 class="product-title">${el.category || ""}</h3>
                <p class="product-description">${el.description || ""}</p>
                <h4 class="product-price">
                  <i class="fa-solid fa-tag"></i> Price:
                  ${el.oldPrice ? `<span class="old-price">Rs. ${el.oldPrice}</span>` : ""}
                  <span class="new-price">Rs. ${el.price}</span>
                </h4>
              </div>
            </div>
          </div>`);

      } else {
        // ACCESSORY CARD 
        $container.append(`
          <div class="col-6 col-md-4 col-lg-3 mb-4">
            <div class="accessory-card">
              <div class="image-wrapper">
                <span class="badge-custom">${el.badge || ""}</span>

                <div class="card-actions">
                  <button class="card-action-btn card-fav-btn ${favActive ? "fav-active" : ""}"
                    data-type="${type}" data-index="${originalIndex}" title="Add to Favourites">
                    <i class="fa-${favActive ? "solid" : "regular"} fa-heart"></i>
                  </button>
                  <button class="card-action-btn card-compare-btn ${inCompare ? "compare-active" : ""}"
                    data-type="${type}" data-index="${originalIndex}" title="Compare">
                    <i class="fa-solid fa-code-compare"></i>
                  </button>
                  <a href="/All Collections/product-detail.html?type=${type}&id=${originalIndex}"
                    class="card-action-btn" title="View Details">
                    <i class="fa-regular fa-eye"></i>
                  </a>
                </div>

                
                <img src="${el.frontImg}" class="product-img active" alt="${el.title}" />
                <img src="${el.hoverImg}" class="product-img"        alt="${el.title} alternate" />

                
                <div class="acc-dots">
                  <button class="acc-dot active" data-img-index="0" aria-label="Show front image"></button>
                  <button class="acc-dot"        data-img-index="1" aria-label="Show alternate image"></button>
                </div>
              </div>

              <!-- Optional text body — mirror your original structure -->
              <div class="card-body p-3">
                <h6 class="mb-1" style="font-family:'Playfair Display',serif;font-size:0.9rem;">${el.title || ""}</h6>
                <p class="price mb-0" style="font-size:0.85rem;">
                  ${el.oldPrice ? `<span class="old-price me-1">Rs. ${el.oldPrice}</span>` : ""}
                  Rs. ${el.price}
                </p>
              </div>
            </div>
          </div>`);
      }
    }


    function updateCompareBar() {
      const $bar = $("#compare-bar");
      const $chips = $("#compareChips");
      $chips.empty();

      compareList.forEach(c => {
        const $chip = $(`
          <div class="compare-chip">
            ${c.item.title}
            <button data-index="${c.index}" data-type="${c.type}"><i class="fa-solid fa-xmark"></i></button>
          </div>`);
        $chip.find("button").on("click", function () {
          const i = parseInt($(this).data("index"));
          const t = $(this).data("type");
          compareList = compareList.filter(c => !(c.index === i && c.type === t));
          // Sync button states
          $(`.card-compare-btn[data-index="${i}"][data-type="${t}"]`).removeClass("compare-active");
          $(`.acc-compare-btn[data-index="${i}"][data-type="${t}"]`).removeClass("compare-active").css({ background: "", color: "" });
          updateCompareBar();
        });
        $chips.append($chip);
      });

      compareList.length >= 2 ? $bar.addClass("visible") : $bar.removeClass("visible");
    }

    function clearCompare() {
      compareList = [];
      $(".card-compare-btn, .acc-compare-btn").removeClass("compare-active").css({ background: "", color: "" });
      updateCompareBar();
    }

    function openCompareModal() {
      if (compareList.length < 2) return;
      const $table = $("#compareTable");
      $table.empty();

      let headerRow = "<tr><th>Feature</th>";
      compareList.forEach(c => { headerRow += `<th style="min-width:150px;">${c.item.title}</th>`; });
      $table.append(headerRow + "</tr>");

      let imgRow = "<tr><td>Product Preview</td>";
      compareList.forEach(c => {
        const src = c.item.frontImg || c.item.image || "";
        imgRow += `
          <td class="text-center">
            <div style="width:100px;height:120px;margin:0 auto;overflow:hidden;border-radius:5px;">
              <img src="${src}" alt="${c.item.title}" style="width:100%;height:100%;object-fit:cover;">
            </div>
          </td>`;
      });
      $table.append(imgRow + "</tr>");

      const rows = [
        ["Collection", c => collectionMeta[c.type]?.label || c.type],
        ["Category", c => c.item.category || "—"],
        ["Price", c => {
          let h = `<span style="color:#3b1d23;font-weight:bold;">Rs. ${c.item.price}</span>`;
          if (c.item.oldPrice) h += `<br><small style="text-decoration:line-through;color:#999;">Rs. ${c.item.oldPrice}</small>`;
          return h;
        }],
        ["Badge", c => c.item.badge ? `<span class="badge bg-light text-dark border">${c.item.badge}</span>` : "—"],
        ["Action", c => `<a href="/All Collections/product-detail.html?type=${c.type}&id=${c.index}" class="btn btn-sm btn-dark">View Item</a>`]
      ];

      rows.forEach(([label, fn]) => {
        let row = `<tr><td style="font-weight:600;background:#f9f9f9;">${label}</td>`;
        compareList.forEach(c => { row += `<td>${fn(c)}</td>`; });
        $table.append(row + "</tr>");
      });

      $("#compare-modal").addClass("open");
    }

    //  PANEL OPEN / CLOSE
    function openPanel() {
      $("#collection-panel, #filter-overlay").addClass("open");
      $("body").css("overflow", "hidden");
    }
    function closePanel() {
      $("#collection-panel, #filter-overlay").removeClass("open");
      $("body").css("overflow", "");
    }

  </script>

</body>

</html>
