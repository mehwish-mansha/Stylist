<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Stylist</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <div id="nav-container"></div>

    <section class="checkout-page">
        <div class="checkout-form-section">
            <h2 style="font-family: 'Playfair Display'; margin-bottom: 30px;">Shipping Details</h2>
            <form id="checkout-form">
                <div style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label>First Name</label>
                        <input type="text" placeholder="Jane" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Last Name</label>
                        <input type="text" placeholder="Doe" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="jane@example.com" required>
                </div>

                <div class="form-group">
                    <label>Shipping Address</label>
                    <input type="text" placeholder="Street Address, Apartment, Suite" required>
                </div>

                <h2 style="font-family: 'Playfair Display'; margin-top: 40px; margin-bottom: 30px;">Payment Method</h2>
                <div class="payment-options">
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" placeholder="0000 0000 0000 0000">
                    </div>
                    <div style="display: flex; gap: 20px;">
                        <div class="form-group" style="flex: 1;">
                            <label>Expiry Date</label>
                            <input type="text" placeholder="MM/YY">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>CVV</label>
                            <input type="password" placeholder="***">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px; padding: 15px;">Complete Order</button>
            </form>
        </div>

        <div class="order-summary-section">
            <h3 style="font-family: 'Playfair Display'; margin-bottom: 20px;">Your Order</h3>
            
            <div class="summary-item">
                <span>Silk Evening Gown (M)</span>
                <span>$240.00</span>
            </div>
            <div class="summary-item">
                <span>Stylist Consultation Fee</span>
                <span>$50.00</span>
            </div>
            <div class="summary-item">
                <span>Shipping</span>
                <span style="color: #27ae60;">Free</span>
            </div>
            
            <div class="summary-item total-row">
                <span>Total</span>
                <span>$290.00</span>
            </div>

            <p style="font-size: 0.8rem; color: #777; margin-top: 20px;">
                <i class="fa-solid fa-shield-halved"></i> Secure Checkout Guaranteed
            </p>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function () {
            $("#nav-container").load("nav.html");
            $("#footer-container").load("footer.html");
        });
    </script>
</body>
</html>
