      bagsCollection.map((el, index) => {
        document.getElementById("cardlist").innerHTML += `
  
   <div class="col-6 col-md-4 col-lg-3 mb-4">
            <div class="accessory-card">
              <div class="image-wrapper">
                <span class="badge-custom">${el.badge}</span>
                <img src="${el.frontImg}" class="product-img active" />
                <img src="${el.hoverImg}" class="product-img" />

                <div class="view-overlay">
                 <a href="bags-details.html?id=${index}" class="view-btn">
                    <i class="fas fa-eye me-1"></i> View Details
                  </a>
                </div>

                <div class="dots">
                  <span class="dot active" data-index="0"></span>
                  <span class="dot" data-index="1"></span>
                </div>
              </div>

              <div class="card-body text-center">
                <h6 class="fw-bold mb-1">
                  ${el.title}
                </h6>
                <p class="price mb-2">Rs. ${el.price}</p>
                <button class="cart-btn">
                  <i class="fas fa-shopping-cart me-1"></i> Add to Cart
                </button>
              </div>
            </div>
          </div>`
      })





      $(".accessory-card").each(function () {
        var card = $(this);
        var images = card.find(".product-img");
        var dots = card.find(".dot");

        dots.on("click", function () {
          var index = $(this).data("index");

          images.removeClass("active");
          dots.removeClass("active");

          images.eq(index).addClass("active");
          $(this).addClass("active");
        });
      });

    });
