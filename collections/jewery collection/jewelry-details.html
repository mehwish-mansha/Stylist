<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewelry Details</title>

  <link rel="stylesheet" href="../MDB5-STANDARD-UI-KIT-Free-9.3.0/css/mdb.min.css" />
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/footer.css">


  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">


  <!-- Font Awesome-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root {
      --background-color: #fcfcfc;
      --sec-bg-color: #3b1d23;
      --text-color: #75555b;
      --sec-text-color: #2f3e46;
    }

    body {
      background: var(--background-color);
      font-family: 'Montserrat', sans-serif;
    }

    /* Title */
    .product-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--text-color);
      font-weight: 700;
    }

    /* Price */
    .price {
      color: var(--sec-bg-color);
      font-weight: 600;
    }

    /* Description */
    .description {
      color: var(--sec-text-color);
      line-height: 1.7;
    }

    /* Image */
    .main-image {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .thumbs img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: 0.3s;
    }

    .thumbs img.active {
      border: 2px solid var(--sec-bg-color);
    }


    /* Size Buttons */
    .size-btn {
      border: 1px solid var(--text-color);
      background: transparent;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      color: var(--sec-text-color);
    }

    .size-btn:hover {
      background: var(--sec-bg-color);
      color: white;
      border-color: var(--sec-bg-color);
    }

    .size-btn.active {
      background: var(--sec-bg-color);
      color: white;
      border-color: var(--sec-bg-color);
    }

    #plusBtn,
    #minusBtn {
      border: 1px solid var(--sec-bg-color);
      border-radius: 8px;
      font-size: 20px;
    }

    /* Buttons */
    .btn-wishlist {
      border: 2px solid var(--sec-bg-color);
      color: var(--sec-bg-color);
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      background: transparent;
      transition: 0.3s;
    }

    .btn-wishlist:hover {
      background: var(--sec-bg-color);
      color: white;
    }

    .btn-cart {
      background: var(--sec-bg-color);
      color: white;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .btn-cart:hover {
      opacity: 0.9;
    }


    .buy-btn {
      background: transparent;
      border: 2px solid var(--sec-bg-color);
      color: var(--sec-bg-color);
      padding: 10px 25px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: var(--sec-bg-color);
      color: #fff;
    }

    .qty-input {
      width: 70px;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .product-info {
      list-style: none;
      padding: 0;
      color: var(--sec-text-color);
    }

    .product-info li {
      margin-bottom: 8px;
    }

    /* Responsive */
    @media(max-width:768px) {
      .product-title {
        font-size: 2rem;
      }
    }
  </style>

<body>

  <div id="nav-container"></div>

  <section class="details-section py-5">
    <div class="container">
      <div class="row g-5">

        <!-- LEFT IMAGES -->
        <div class="col-lg-6" data-aos="fade-right">

          <div class="main-image">
            <img id="mainImg" src="jewery img/jimg1.webp" class="img-fluid">
          </div>

          <div class="thumbs d-flex mt-3">
            <img src="jewery img/jimg1.webp" class="thumb active">
            <img src="jewery img/jhover1.webp" class="thumb">
          </div>

        </div>

        <!-- RIGHT CONTENT -->
        <div class="col-lg-6" data-aos="fade-left">

          <h2 class="product-title">Elegant Gold Earrings</h2>

          <div class="rating mb-2">
            ★★★★★ <span>(12 Reviews)</span>
          </div>

          <h3 class="price mb-3">Rs. 2,999</h3>

          <p class="description">
            Premium quality gold plated earrings with elegant finishing.
            Perfect for weddings and formal occasions.
          </p>

          <!-- Quantity -->
          <div class="mt-4">
            <p class="info-label">Quantity</p>
            <div class="d-flex align-items-center gap-3">
              <button class="btn btn-light" id="minusBtn"><strong>-</strong></button>
              <span id="qtyValue" class="fw-bold fs-5">1</span>
              <button class="btn btn-light" id="plusBtn"><strong>+</strong></button>
            </div>
          </div>

          <!-- Buttons -->
          <div class="mt-4 d-flex gap-3 flex-wrap">
            <button class="btn-wishlist" id="wishlistBtn">
              <i class="fa-regular fa-heart"></i> ADD TO WISHLIST
            </button>

            <button class="btn-cart" id="cartBtn">
              <i class="fa-solid fa-cart-shopping"></i> ADD TO CART
            </button>
          </div>

          <hr class="my-4">

          <ul class="product-info">
            <li>✔ Premium Quality</li>
            <li>✔ 7 Days Return</li>
            <li>✔ Cash on Delivery</li>
            <li>✔ Free Shipping</li>
          </ul>

        </div>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

  <script src="../MDB5-STANDARD-UI-KIT-Free-9.3.0/js/mdb.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
    integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>


    <script src="/main.js"></script>

  <script>

    // Nav &Footer Load
    $(function () {
      $("#nav-container").load("/nav.html");
      $("#footer-container").load("/footer.html");
    });

    AOS.init();

    document.querySelectorAll(".thumb").forEach(img => {
      img.addEventListener("click", function () {
        document.getElementById("mainImg").src = this.src;
        document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
        this.classList.add("active");
      });
    });

    // Quantity control
    let qty = 1;
    const qtyValue = document.getElementById("qtyValue");

    document.getElementById("plusBtn").addEventListener("click", () => {
      qty++;
      qtyValue.innerText = qty;
    });

    document.getElementById("minusBtn").addEventListener("click", () => {
      if (qty > 1) {
        qty--;
        qtyValue.innerText = qty;
      }
    });

    // Wishlist button
    document.getElementById("wishlistBtn").addEventListener("click", () => {
      alert("Added to Wishlist ❤️");
    });

    // Cart button
    document.getElementById("cartBtn").addEventListener("click", () => {
      alert("Added to Cart 🛒");
    });
  </script>

</body>

</html>
