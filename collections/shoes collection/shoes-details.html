<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoes Details</title>

  <link rel="stylesheet" href="../MDB5-STANDARD-UI-KIT-Free-9.3.0/css/mdb.min.css" />

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/footer.css">


  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">


  <!-- Font Awesome-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />


  <style>
    :root {
      --theme: #3b1d23;
      --text: #75555b;
    }

    body {
      background: #fcfcfc;
      font-family: 'Montserrat', sans-serif;
    }

    /* Title */
    .product-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: var(--text);
      font-weight: 700;
    }

    /* Price */
    .price {
      color: var(--theme);
      font-weight: 700;
    }

    /* Image */
    .main-image img {
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .thumbs img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid transparent;
    }

    .thumbs img.active {
      border-color: var(--theme);
    }

    /* Size Buttons */
    .size-btn {
      border: 1px solid var(--text);
      background: transparent;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
    }

    .size-btn:hover,
    .size-btn.active {
      background: var(--theme);
      color: white;
      border-color: var(--theme);
    }

    /* Buttons */
    .btn-wishlist {
      border: 2px solid var(--theme);
      color: var(--theme);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      background: transparent;
    }

    .btn-cart {
      background: var(--theme);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      transition: 0.3s;
    }

    /* Cart Animation */
    .cart-animate {
      animation: moveCart 0.6s linear 3;
    }

    @keyframes moveCart {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(40px);
      }
    }

    /* Responsive */
    @media(max-width:768px) {
      .product-title {
        font-size: 2rem;
      }
    }

    .cart-animate {
      animation: cartMove 0.6s linear 3;
    }

    @keyframes cartMove {
      0% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(30px);
      }

      100% {
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>

  <div id="nav-container"></div>

  <section class="details-section py-5">
    <div class="container">
      <div class="row g-5">

        <!-- LEFT IMAGES -->
        <div class="col-lg-6">

          <div class="main-image">
            <img id="mainImg" src="shoes img/simg1.webp" class="img-fluid">
          </div>

          <div class="thumbs d-flex mt-3">
            <img src="shoes img/simg1.webp" class="thumb active">
            <img src="shoes img/shover2.webp" class="thumb">
          </div>

        </div>

        <!-- RIGHT CONTENT -->
        <div class="col-lg-6">

          <h2 class="product-title">Premium Sport Shoes</h2>

          <div class="rating mb-2">
            ★★★★★ <span>(25 Reviews)</span>
          </div>

          <h3 class="price mb-3">Rs. 4,500</h3>

          <p class="text-muted">
            High quality comfortable sport shoes perfect for daily wear and outdoor activities.
            Lightweight design with premium finishing.
          </p>

          <!-- SIZE SELECTOR -->
          <div class="mt-4">
            <p class="fw-bold">Size</p>

            <div class="d-flex flex-wrap gap-2" id="sizeBox">
              <button class="size-btn active">All Size Available</button>
              <button class="size-btn">6</button>
              <button class="size-btn">7</button>
              <button class="size-btn">8</button>
              <button class="size-btn">9</button>
              <button class="size-btn">10</button>
            </div>
          </div>

          <!-- Quantity -->
          <div class="mt-4">
            <p class="fw-bold">Quantity</p>

            <div class="d-flex align-items-center gap-3">
              <button class="btn btn-light" id="minusBtn"><strong>-</strong></button>
              <span id="qtyValue" class="fw-bold fs-5">1</span>
              <button class="btn btn-light" id="plusBtn"><strong>+</strong></button>
            </div>
          </div>

          <!-- Buttons -->
          <div class="mt-4 d-flex gap-3 flex-wrap">

            <button class="btn-wishlist" id="wishlistBtn">
              <i class="fa-regular fa-heart"></i> ADD TO WISHLIST
            </button>

            <button class="btn-cart" id="cartBtn">
              <i class="fa-solid fa-cart-shopping"></i> ADD TO CART
            </button>

          </div>

          <hr class="my-4">

          <ul class="text-muted list-unstyled">
            <li>✔ Premium Quality</li>
            <li>✔ 7 Days Return</li>
            <li>✔ Cash on Delivery</li>
            <li>✔ Free Shipping</li>
          </ul>

        </div>
      </div>
    </div>
  </section>


  <div id="footer-container"></div>

   
          <script src="../MDB5-STANDARD-UI-KIT-Free-9.3.0/js/mdb.umd.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
            integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="/main.js"></script>


  <script>

      // Nav &Footer Load
 $(function () {
      $("#nav-container").load("/nav.html");
      $("#footer-container").load("/footer.html");
    });

    /* Thumbnail Change */
    document.querySelectorAll(".thumb").forEach(img => {
      img.addEventListener("click", function () {

        document.getElementById("mainImg").src = this.src;

        document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
        this.classList.add("active");

      });
    });

    /* Size Selection Logic */
    document.querySelectorAll("#sizeBox .size-btn").forEach(btn => {
      btn.addEventListener("click", function () {

        document.querySelectorAll("#sizeBox .size-btn")
          .forEach(b => b.classList.remove("active"));

        this.classList.add("active");

      });
    });

    /* Quantity Control */
    let qty = 1;
    const qtyValue = document.getElementById("qtyValue");

    document.getElementById("plusBtn").addEventListener("click", () => {
      qty++;
      qtyValue.innerText = qty;
    });

    document.getElementById("minusBtn").addEventListener("click", () => {
      if (qty > 1) {
        qty--;
        qtyValue.innerText = qty;
      }
    });

    /* Wishlist */
    document.getElementById("wishlistBtn").addEventListener("click", () => {
      alert("Added to Wishlist ❤️");
    });

    /* Cart Animation (Left → Right 3 Times Smooth) */

    const cartBtn = document.getElementById("cartBtn");

    cartBtn.addEventListener("click", () => {

      cartBtn.classList.add("cart-animate");

      setTimeout(() => {
        cartBtn.classList.remove("cart-animate");
      }, 1800);

      alert("Added to Cart 🛒");

    });
  </script>

</body>

</html>
