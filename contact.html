<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">


    <!-- Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="contact.css">

    <title>Contact Us | Stylist</title>
</head>

<body>

    <!--Navbar Section-->
    <div id="nav-container"></div>

    <!--Contact Section-->
    <section class="contact-section">
        <div class="contact-container">

            <!-- LEFT SIDE -->
            <div class="contact-info">
                <p class="subtitle">GET IN TOUCH</p>
                <h2>Contact Us</h2>
                <p class="description">
                    Have questions about our stylists or collections?
                    We’re here to help you find your perfect look.
                </p>

                <div class="info-item">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                            class="bi bi-telephone contact-icon" viewBox="0 0 16 16">
                            <path
                                d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z" />
                        </svg>
                        </div>
                        <div>
                            <h4>Phone</h4>
                        <p>+1 (555) 123-4567</p>
                        </div>
                </div>

                <div class="info-item">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                            class="bi bi-envelope contact-icon" viewBox="0 0 16 16">
                            <path
                                d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z" />
                        </svg>
                    </div>
                    <div>
                        <h4>Email</h4>
                        <p>mehwishmansha65@gmail.com</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE FORM -->
            <div class="contact-form">
                <form>
                    <div class="row">
                        <div class="input-group">
                            <label>FIRST NAME</label>
                            <input type="text" placeholder="Mehwish" required>
                        </div>

                        <div class="input-group">
                            <label>LAST NAME</label>
                            <input type="text" placeholder="Mansha" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>EMAIL</label>
                        <input type="email" placeholder="mehwishmansha65@gmail.com" required>
                    </div>

                    <div class="input-group">
                        <label>MESSAGE</label>
                        <textarea placeholder="How can we help you?"></textarea>
                    </div>

                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>

        </div>
    </section>

    <!--  MAP SECTION -->
    <section class="map-section">
        <iframe src="https://www.google.com/maps?q=New+York,+NY+10018&output=embed" width="100%" height="100%"
            style="border:0;" allowfullscreen="" loading="lazy">
        </iframe>
    </section>






    <!--Footer Section-->
    <div id="footer-container"></div>


    <!-- jquery-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="../main.js"></script>




    <script>

        // Navbar and Footer

        $(function () {

            $("#nav-container").load("nav.html", function () {
                initNavbar();
            });

            $("#footer-container").load("footer.html");

        });
    </script>
</body>

</html>
