<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Stylist</title>

    <link rel="shortcut icon" href="/assets/logo/dress.png" type="image/x-icon">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">


    <!-- Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="/favourites.css">
</head>

<body>

    <!-- Navbar -->
    <div id="nav-container"></div>



    <!-- HEADER -->
    <section class="fav-header">
        <h2>My Favourites</h2>
        <p>Pieces you’ve saved for later.</p>
    </section>

    <!-- FAVOURITES SECTION -->
    <section class="fav-section">

        <div class="fav-container">

            <!-- ITEM 1 -->
            <div class="fav-item">
                <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38" alt="Dress">

                <div class="fav-details">
                    <h3>Silk Evening Dress</h3>
                    <p class="category">Summer Collection</p>
                    <p class="price">$249.00</p>

                    <div class="fav-actions">
                        <button class="move-btn">Move to Cart</button>
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>
            </div>

            <!-- ITEM 2 -->
            <div class="fav-item">
                <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d" alt="Jacket">

                <div class="fav-details">
                    <h3>Classic Blazer</h3>
                    <p class="category">Winter Collection</p>
                    <p class="price">$189.00</p>

                    <div class="fav-actions">
                        <button class="move-btn">Move to Cart</button>
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>
            </div>

        </div>

    </section>









    <!--Footer Section-->
    <div id="footer-container"></div>


    <!-- jquery-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="/main.js"></script>





    <script>

        // Navbar and Footer

        $(function () {

            $("#nav-container").load("nav.html", function () {
                initNavbar();
                 initNavFeatures();
            });

            $("#footer-container").load("footer.html");

        });

        $(document).ready(function() {
    // 1. Remove Item Logic
    $('.fav-container').on('click', '.remove-btn', function() {
        const item = $(this).closest('.fav-item');
        
        // Add a simple fade-out effect for better UX
        item.fadeOut(300, function() {
            $(this).remove();
            checkEmptyWishlist();
        });
    });

    // 2. Move to Cart Logic
    $('.fav-container').on('click', '.move-btn', function() {
        const item = $(this).closest('.fav-item');
        const itemName = item.find('h3').text();
        
        // Here you would typically trigger an AJAX call to your backend or update LocalStorage
        console.log(`Moving ${itemName} to cart...`);
        
        alert(`${itemName} has been added to your cart!`);
        
        // Remove from wishlist after moving
        item.fadeOut(300, function() {
            $(this).remove();
            checkEmptyWishlist();
        });
    });

    // 3. Handle Empty State
    function checkEmptyWishlist() {
        if ($('.fav-item').length === 0) {
            $('.fav-container').html(`
                <div class="empty-msg" style="text-align:center; padding: 50px;">
                    <i class="fa-regular fa-heart" style="font-size: 3rem; color: #ccc;"></i>
                    <p style="margin-top: 20px;">Your wishlist is currently empty.</p>
                    <a href="/collection.html" class="move-btn" style="display:inline-block; text-decoration:none; margin-top:10px;">Continue Shopping</a>
                </div>
            `);
        }
    }
});


    </script>

</body>

</html>
