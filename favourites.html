<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Stylist</title>

    <link rel="shortcut icon" href="/assets/logo/dress.png" type="image/x-icon">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">


    <!-- Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="/favourites.css">
</head>

<body>

    <!-- Navbar -->
    <div id="nav-container"></div>



    <!-- HEADER -->
    <section class="fav-header">
        <h2>My Favourites</h2>
        <p>Pieces you’ve saved for later.</p>
    </section>

    <!-- FAVOURITES SECTION -->
   <section class="fav-section">
    <div class="fav-container" id="wishlist-items-container"></div>
</section>








    <!--Footer Section-->
    <div id="footer-container"></div>


    <!-- jquery-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="/main.js"></script>





    <script>

        // Navbar and Footer

        $(function () {

            $("#nav-container").load("nav.html", function () {
                initNavbar();
                 initNavFeatures();
            });

            $("#footer-container").load("footer.html");

        });
        

       $(document).ready(function() {
    // Run the display function as soon as page loads
    renderWishlist();

    function renderWishlist() {
        const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        const container = $('#wishlist-items-container');
        container.empty(); // Clear the "default" items

        if (wishlist.length === 0) {
            container.html(`
                <div class="empty-msg" style="text-align:center; padding: 50px; width: 100%;">
                    <i class="fa-regular fa-heart" style="font-size: 3rem; color: #ccc;"></i>
                    <p style="margin-top: 20px;">Your wishlist is currently empty.</p>
                    <a href="/index.html" class="move-btn" style="display:inline-block; text-decoration:none; margin-top:10px;">Continue Shopping</a>
                </div>
            `);
            return;
        }

        // Loop through LocalStorage and create the HTML for each item
        wishlist.forEach(item => {
            container.append(`
                <div class="fav-item" data-id="${item.id}">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="fav-details">
                        <h3>${item.name}</h3>
                        <p class="category">${item.category}</p>
                        <p class="price">${item.price}</p>
                        <div class="fav-actions">
                            <button class="move-btn">Move to Cart</button>
                            <button class="remove-btn" onclick="removeFromWishlist(${item.id})">Remove</button>
                        </div>
                    </div>
                </div>
            `);
        });
    }

    // Function to handle the removal from LocalStorage
    window.removeFromWishlist = function(id) {
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        // Filter out the item with the matching ID
        wishlist = wishlist.filter(item => item.id !== id);
        // Save the updated list back to LocalStorage
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        
        // Refresh the display
        $(`.fav-item[data-id="${id}"]`).fadeOut(300, function() {
            renderWishlist();
        });
    };

});


    </script>

</body>

</html>
