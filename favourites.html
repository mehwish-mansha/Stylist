    // ── Remove from wishlist ──────────────────────────────────────────
    window.removeFromWishlist = function (id) {
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        wishlist = wishlist.filter(item => item.id !== id);
        localStorage.setItem("wishlist", JSON.stringify(wishlist));

        $(`.fav-item[data-id="${id}"]`).fadeOut(300, function () {
            renderWishlist();
        });

        showToast("Removed from favourites.", "fa-heart-crack");
    };

    // ── Move to cart ──────────────────────────────────────────────────
    window.moveToCart = function (id) {
        const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        const item = wishlist.find(w => w.id === id);
        if (!item) return;

        // Add to cart in localStorage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const inCart = cart.some(c => c.id === id);
        if (!inCart) {
            cart.push({ ...item, qty: 1 });
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        // Remove from wishlist
        removeFromWishlist(id);
        showToast("Moved to cart!", "fa-bag-shopping");
    };

    // ── Toast notification ────────────────────────────────────────────
    function showToast(message, icon) {
        // Remove existing toast
        $('#favToast').remove();

        const toast = $(`
            <div id="favToast" style="
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: #3b1d23;
                color: #fff;
                padding: 14px 22px;
                border-radius: 12px;
                box-shadow: 0 8px 28px rgba(59,29,35,0.22);
                display: flex;
                align-items: center;
                gap: 12px;
                font-family: 'DM Sans', sans-serif;
                font-size: 0.92rem;
                font-weight: 500;
                z-index: 9999;
                opacity: 0;
                transform: translateY(16px);
                transition: opacity 0.3s, transform 0.3s;
            ">
                <i class="fa-solid ${icon}" style="color:#e8a0a8; font-size:1.1rem;"></i>
                ${message}
            </div>
        `);

        $('body').append(toast);
        setTimeout(() => toast.css({ opacity: 1, transform: 'translateY(0)' }), 10);
        setTimeout(() => {
            toast.css({ opacity: 0, transform: 'translateY(16px)' });
            setTimeout(() => toast.remove(), 350);
        }, 2500);
    }
    </script>
