<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Stylist</title>
    <link rel="shortcut icon" href="/assets/logo/dress.png" type="image/x-icon">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">


    <!-- Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="login.css">

</head>

<body>
    <!-- Navbar -->

    <div id="nav-container"></div>



    <section class="auth-section">
        <div class="auth-container ">

            <div class="auth-header">
                <h2 id="form-title">Login</h2>
                <p>Access your personalized styling experience.</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" class="auth-form active">

                <div class="input-group floating">
                    <input type="email" required>
                    <label>Email</label>
                </div>

                <div class="input-group floating">
                    <i class="fa-regular fa-eye login-toggle-password"></i>
                    <input type="password" required>
                    <label>Password</label>
                </div>

                <button type="submit" class="btn">Login</button>

                <p class="switch-text">
                    Don’t have an account?
                    <span onclick="switchForm()">Register</span>
                </p>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" class="auth-form">

                <div class="input-group floating">
                    <input type="text" required id="fullname">
                    <label>Full Name</label>
                    <span class="error-msg"></span>
                </div>

                <div class="input-group floating">
                    <input type="email" required id="email">
                    <label>Email</label>
                    <span class="error-msg"></span>
                </div>


                <div class="input-group floating password-group">
                    <input type="password" required id="password">
                    <label>Password</label>
                    <i class="fa-regular fa-eye toggle-password"></i>
                    <span class="error-msg"></span>
                </div>

                <div class="input-group floating password-group">
                    <input type="password" required id="confirm-password">
                    <label>Confirm Password</label>
                    <i class="fa-regular fa-eye toggle-password"></i>
                    <span class="error-msg"></span>
                </div>



                <button type="submit" class="btn">Create Account</button>

                <p class="switch-text">
                    Already have an account?
                    <span onclick="switchForm()">Login</span>
                </p>
            </form>

        </div>

    </section>


    <div id="toast" class="toast"></div>




    <!--Footer Section-->
    <div id="footer-container"></div>


    <!-- jquery-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="/main.js"></script>





    <script>
    // Navbar and Footer
    $(function () {
        $("#nav-container").load("nav.html", function () {
            initNavbar();
            initNavFeatures();
        });
        $("#footer-container").load("footer.html");
    });

    function switchForm() {
        document.getElementById("login-form").classList.toggle("active");
        document.getElementById("register-form").classList.toggle("active");

        const title = document.getElementById("form-title");
        title.textContent = title.textContent === "Login" ? "Register" : "Login";
    }

    // --- NEW: Toast Notification Function ---
    function showToast(message, type = "success") {
    const $toast = $("#toast");
    
    // Set message and type
    $toast.text(message).addClass("show " + type);
    
    // Hide and cleanup after 3 seconds
    setTimeout(function() {
        $toast.removeClass("show success");
    }, 3000);
}

    // Form Validation
    $(document).ready(function () {
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
        const nameRegex = /^[A-Z][a-zA-Z ]{1,49}$/;

        // --- Floating label effect ---
        $(".floating input").each(function () {
            toggleFilled($(this));
        });

        $(".floating input").on("input blur focus", function () {
            toggleFilled($(this));
            validateField($(this));
        });

        function toggleFilled($input) {
            if ($input.val().trim() !== "") {
                $input.addClass("filled");
            } else {
                $input.removeClass("filled");
            }
        }

        // --- Toggle password visibility ---
        $(document).on("click", ".login-toggle-password, .toggle-password", function () {
            const $input = $(this).closest('.input-group').find('input');
            const isPassword = $input.attr("type") === "password";
            $input.attr("type", isPassword ? "text" : "password");
            $(this).toggleClass("fa-eye fa-eye-slash");
        });

        // --- Inline validation ---
        function validateField($input) {
            const val = $input.val();
            const id = $input.attr("id");
            const $error = $input.siblings(".error-msg");

            if (id === "password" || $input.attr('type') === 'password' && !$input.attr('id')) {
                // If it's a password field
                if (val && !passwordRegex.test(val)) {
                    $error.text("Password must be 8+ chars, include uppercase, lowercase, number & symbol.");
                } else { $error.text(""); }
            } else if (id === "confirm-password") {
                const passwordVal = $("#password").val();
                $error.text(val && val !== passwordVal ? "Passwords do not match." : "");
            } else if (id === "fullname") {
                $error.text(val && !nameRegex.test(val) ? "Name must start with capital letter." : "");
            } else if (id === "email" || $input.attr('type') === 'email') {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                $error.text(val && !emailRegex.test(val) ? "Please enter a valid email." : "");
            }
        }

        // --- Validate and Toast on Register ---
        $("#register-form").submit(function (e) {
            e.preventDefault(); // Prevent actual refresh for demo
            
            $(this).find("input").each(function () {
                validateField($(this));
            });

            const hasErrors = $(this).find(".error-msg").filter(function() { 
                return $(this).text() !== ""; 
            }).length > 0;

            if (!hasErrors) {
                showToast("Account created successfully!");
                // Here you would normally do your AJAX call
            }
        });

        // --- Validate and Toast on Login ---
        $("#login-form").submit(function (e) {
            e.preventDefault(); // Prevent actual refresh for demo
            
            let allFilled = true;
            $(this).find("input").each(function() {
                if($(this).val() === "") allFilled = false;
            });

            if (allFilled) {
                showToast("Welcome back! Logging in...");
            } else {
                showToast("Please fill in all fields.");
            }
        });
    });
</script>

</body>

</html>
