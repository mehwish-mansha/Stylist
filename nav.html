<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/logo/Favicon.png" type="image/x-icon">
    <title>Sample Navbar</title>

    <!-- Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">

    <!-- External Css -->
    <link rel="stylesheet" href="nav.css">

    
</head>

<body>


    <nav class="nav-container">
        <div class="nav-wrapper">

            <!-- Hamburger -->
            <div class="hamburger" id="hamburger">
                <i class="fa-solid fa-bars"></i>
            </div>

            <!-- Logo Center -->
            <!-- <div class="logo">
            <a href="#">
                <img src="./assets/logo/dress.png" alt="logo">
            </a>
        </div> -->

            <!-- Logo with dress icon -->
            <div class="logo">
                <!-- Dress icon as inline SVG -->
                <!-- <img src="./assets/logo/dress.png" alt=""> -->
                <a href="#"><span>Stylist</span></a>
            </div>

            <!-- Right Icons -->
            <div class="nav-icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-regular fa-user"></i>
                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>

        </div>

        <!-- Hidden Menu -->
        <ul class="nav-links" id="navLinks">

            <!-- Close Button -->
            <div class="close-btn" id="closeBtn">
                <i class="fa-solid fa-xmark"></i>
            </div>

            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT</a></li>
            <li class="dropdown">

                <div class="dropdown-header">
                    <span id="stylist">STYLISTS</span>
                    <i class="fa-solid fa-plus"></i>
                </div>

                <ul class="submenu">
                    <li><a href="#">Personal Stylist</a></li>
                    <li><a href="#">Bridal Stylist</a></li>
                    <li><a href="#">Celebrity Stylist</a></li>
                    <li><a href="#">Fashion Consultant</a></li>
                    <li><a href="#">Virtual Styling</a></li>
                </ul>

            </li>

            <li class="dropdown">

                <div class="dropdown-header" id="collectionToggle">
                    <span id="collection">COLLECTIONS</span>
                    <i class="fa-solid fa-plus" id="collectionIcon"></i>
                </div>

                <ul class="submenu" id="collectionMenu">
                    <li><a href="#">Summer Wear</a></li>
                    <li><a href="#">Winter Collection</a></li>
                    <li><a href="#">Formal Dresses</a></li>
                    <li><a href="#">Casual Style</a></li>
                    <li><a href="#">Brides</a></li>
                </ul>

            </li>

            <li><a href="#">COMPARE</a></li>
            <li><button class="nav-btn">BOOK AN APPOINTMENT</button></li>

            <div class="sidebar-social">
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#"><i class="fa-brands fa-github"></i></a>
            </div>

        </ul>

    </nav>


    <script src="main.js"></script>

</html>
