    <script>
        $(document).ready(function () {

            // Toggle search bar expansion
            $(".search-icon").click(function () {
                $(".nav-search").toggleClass("active");
                const $input = $("#search-input");

                if ($(".nav-search").hasClass("active")) {
                    $input.focus();
                    $(".page-content").addClass("page-blur"); // blur content
                } else {
                    $input.val("");
                    $(".page-content").removeClass("page-blur");
                }
            });

            // Keep blur while typing
            $("#search-input").on("focus input", function () {
                $(".page-content").addClass("page-blur");
            });

            // Remove blur when search loses focus & empty
            $("#search-input").on("blur", function () {
                if ($(this).val() === "") {
                    $(".page-content").removeClass("page-blur");
                    $(".nav-search").removeClass("active");
                }
            });

        });

    </script>
